name: Build Docker Images

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./lab2/backend
          file: ./lab2/backend/Dockerfile
          push: false
          tags: backend:latest
          outputs: type=docker,dest=/tmp/backend.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./lab2/nginx/Dockerfile
          push: false
          tags: nginx-custom:latest
          outputs: type=docker,dest=/tmp/nginx.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend.tar
          retention-days: 7

      - name: Upload nginx image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: /tmp/nginx.tar
          retention-days: 7
